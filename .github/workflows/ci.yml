name: Rust
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        toolchain: ['1.85.0', stable]
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --offline --all-targets --all-features -- -D warnings
      - run: cargo test --offline --all-features
      - run: cargo test --offline --release --all-features
      - run: cargo run --offline --release --example property_corpus
      - run: cargo run --offline --release --example fuzz_smoke
